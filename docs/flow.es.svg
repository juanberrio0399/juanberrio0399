<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Cómo funciona un proyecto típico mío: los Excel del negocio pasan por un ETL en Python a un warehouse en Parquet y DuckDB; ese warehouse y otras fuentes que ingiere GitHub Actions llegan a Cloudflare R2, y un tablero en React consulta los Parquet en el navegador con DuckDB-WASM">
<title>Cómo funciona un proyecto típico mío: los Excel del negocio pasan por un ETL en Python a un warehouse en Parquet y DuckDB; ese warehouse y otras fuentes que ingiere GitHub Actions llegan a Cloudflare R2, y un tablero en React consulta los Parquet en el navegador con DuckDB-WASM</title>
